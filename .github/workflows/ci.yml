name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      # Central package/build props decide which upstream versions are compiled against, so a
      # re-pin is exactly the change most likely to break the build. Without these a dependency
      # bump merged with no CI run at all.
      - '**/*.props'
      - '**/*.slnx'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      # Central package/build props decide which upstream versions are compiled against, so a
      # re-pin is exactly the change most likely to break the build. Without these a dependency
      # bump merged with no CI run at all.
      - '**/*.props'
      - '**/*.slnx'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore IronProw.slnx

      - name: Build
        run: dotnet build IronProw.slnx --no-restore -c Release

      - name: Test
        # xUnit v3/MTP has no VSTest-style single-expression --filter; each excluded trait value
        # gets its own --filter-not-trait (repeated flags AND together, empirically verified in
        # modules/memory-indexer cycle-358). --hangdump/--hangdump-timeout replaces --blame-hang.
        run: dotnet test IronProw.slnx --no-build -c Release --verbosity normal --filter-not-trait "Category=Integration" --filter-not-trait "Category=RequiresApiKey" --filter-not-trait "Category=Performance" --hangdump --hangdump-timeout 5m
